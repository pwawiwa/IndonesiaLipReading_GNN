# GraphSAGE Model Configuration Template
# Graph Sample and Aggregate for Lip Reading

data:
  partition: lips
  feature_level: B0
  feature_dir: /home/member2/tomoooo/IndonesiaLipReading_GNN/features

model:
  name: graphsage
  params:
    # in_features and num_classes are auto-filled
    hidden_dim: 128
    num_layers: 2
    dropout: 0.5
    aggregator: mean  # mean, max
    temporal_pool: mean

training:
  output_dir: /home/member2/tomoooo/IndonesiaLipReading_GNN/results
  batch_size: 32
  epochs: 100
  learning_rate: 0.001
  weight_decay: 0.0001
  optimizer: adam
  
  scheduler:
    name: steplr
    step_size: 30
    gamma: 0.1
  
  early_stopping_patience: 15
  num_workers: null

