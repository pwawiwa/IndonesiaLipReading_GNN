# GIN (Graph Isomorphism Network) Model Configuration Template
# Graph Isomorphism Network for Lip Reading

data:
  partition: lips  # lips, mouth, full
  feature_level: B0  # B0, B1, B2, B3, B4
  feature_dir: /home/member2/tomoooo/IndonesiaLipReading_GNN/features

model:
  name: gin
  params:
    # in_features and num_classes are auto-filled from data
    hidden_dim: 128
    num_layers: 2
    dropout: 0.5
    eps: 0.0  # Initial epsilon for GIN aggregation (0.0 recommended)
    train_eps: false  # Whether to make epsilon trainable
    temporal_pool: mean  # mean, max, last

training:
  output_dir: /home/member2/tomoooo/IndonesiaLipReading_GNN/results
  batch_size: 32
  epochs: 100
  learning_rate: 0.001
  weight_decay: 0.0001
  optimizer: adam  # adam, adamw, sgd
  
  # Optional: Learning rate scheduler
  scheduler:
    name: steplr  # steplr, cosine
    step_size: 30
    gamma: 0.1
  
  early_stopping_patience: 15
  
  # DataLoader settings
  num_workers: null  # null = auto (50% of CPU cores)

