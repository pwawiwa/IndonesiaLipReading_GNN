# GNN-GRU Model Configuration Template
# Hybrid GNN-GRU for Lip Reading (Spatial + Temporal)

data:
  partition: lips
  feature_level: B0
  feature_dir: /home/member2/tomoooo/IndonesiaLipReading_GNN/features

model:
  name: gnn_gru
  params:
    # in_features and num_classes are auto-filled
    hidden_dim: 128
    num_gnn_layers: 2
    num_gru_layers: 1
    dropout: 0.5
    bidirectional: false  # true for BiGRU

training:
  output_dir: /home/member2/tomoooo/IndonesiaLipReading_GNN/results
  batch_size: 32
  epochs: 100
  learning_rate: 0.001
  weight_decay: 0.0001
  optimizer: adam
  
  scheduler:
    name: steplr
    step_size: 30
    gamma: 0.1
  
  early_stopping_patience: 15
  num_workers: null

