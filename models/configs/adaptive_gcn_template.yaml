# Adaptive GCN Model Configuration Template
# Adaptive Graph Convolutional Network for Lip Reading
# Learns graph structure dynamically in addition to fixed MediaPipe topology

data:
  partition: full  # lips, mouth, full
  feature_level: B0  # B0, B1, B2, B3
  feature_dir: /home/member2/tomoooo/IndonesiaLipReading_GNN/features

model:
  name: adaptive_gcn
  params:
    # in_features and num_classes are auto-filled from data
    # num_nodes must match partition: 468 for full, ~80 for mouth, ~40 for lips
    num_nodes: 468  # Number of nodes (468 for full face, adjust for other partitions)
    hidden_dim: 128
    num_layers: 2
    dropout: 0.5
    alpha: 0.5  # Weight for combining fixed and adaptive adjacency (0=only adaptive, 1=only fixed)
    temporal_pool: mean  # mean, max, last

training:
  output_dir: /home/member2/tomoooo/IndonesiaLipReading_GNN/results
  batch_size: 8  # Smaller batch for full partition (468 nodes)
  epochs: 100
  learning_rate: 0.001
  weight_decay: 0.0001
  optimizer: adam  # adam, adamw, sgd
  
  # Optional: Learning rate scheduler
  scheduler:
    name: steplr  # steplr, cosine
    step_size: 30
    gamma: 0.1
  
  early_stopping_patience: 15
  
  # DataLoader settings
  num_workers: null  # null = auto (0 for memory efficiency)

