# ST-GCN Model Configuration Template
# Spatial-Temporal Graph Convolutional Network for Lip Reading

data:
  partition: lips
  feature_level: B0
  feature_dir: /home/member2/tomoooo/IndonesiaLipReading_GNN/features

model:
  name: stgcn
  params:
    # in_features and num_classes are auto-filled
    hidden_dim: 64
    num_blocks: 3
    kernel_size: 9  # temporal kernel size
    dropout: 0.5
    temporal_pool: mean

training:
  output_dir: /home/member2/tomoooo/IndonesiaLipReading_GNN/results
  batch_size: 16  # Smaller batch for ST-GCN (memory intensive)
  epochs: 100
  learning_rate: 0.001
  weight_decay: 0.0001
  optimizer: adam
  
  scheduler:
    name: cosine
  
  early_stopping_patience: 15
  num_workers: null

